# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build: 
    name: Build and test package on ${{ matrix.os }} with swift v${{ matrix.swift }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        swift: ["6.4.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: ${{ matrix.swift }}
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

